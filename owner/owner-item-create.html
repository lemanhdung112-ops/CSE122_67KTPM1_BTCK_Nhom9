<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f9f6">
    <title>Đăng món đồ — ReUseHub</title>
    <link rel="stylesheet" href="../css/portal.css">
    <style>
body[data-page^="owner-"] {
    --role-accent: #245c45;
    --role-accent-soft: #edf4ee;
}

body[data-page^="owner-"] .portal-page-heading {
    border-color: #dfe9e0;
    background:
        radial-gradient(ellipse at 92% 10%, #c7dfca, transparent 40%),
        linear-gradient(120deg, #edf5ee, #f8fbf7 72%);
}

body[data-page^="owner-"] .portal-nav-link.active,
body[data-page^="owner-"] .portal-nav-link:hover {
    background: var(--role-accent-soft);
    color: var(--role-accent);
}

body[data-page^="owner-"] .portal-action-button.primary {
    border-color: var(--role-accent);
    background: var(--role-accent);
}

body[data-page^="owner-"] .portal-stat strong {
    color: var(--role-accent);
}

    </style>
    <script src="../js/reusehub-seed-data.js" defer></script>
    <script src="../js/reusehub-store.js" defer></script>
    <script>
(function () {
    window.ReUseHubRoleViews = window.ReUseHubRoleViews || {};
    window.ReUseHubRoleViews.owner = {
        renderItems(context, listings, requests) {
            const { store, node, actionButton, makeListingCard, makeRequestCard, empty, statBox } = context;
            const user = store.currentUser;
            const ownListings = listings.filter((entry) => entry.ownerId === user.id);
            const active = ownListings.filter((entry) => ["active", "repair", "reserved"].includes(entry.status)).length;
            const pending = requests.filter((entry) => entry.ownerId === user.id && entry.status === "pending").length;
            const stats = document.getElementById("owner-stats");
            stats.replaceChildren(
                statBox("Tin đang hoạt động", active),
                statBox("Chờ kiểm duyệt", ownListings.filter((entry) => entry.status === "pending").length),
                statBox("Yêu cầu chờ xử lý", pending),
                statBox("Đã hoàn tất", ownListings.filter((entry) => ["donated", "completed"].includes(entry.status)).length)
            );

            const listingHost = document.getElementById("owner-listings");
            listingHost.replaceChildren();
            if (!ownListings.length) listingHost.append(empty("Bạn chưa có món đồ nào. Hãy đăng món đầu tiên."));
            ownListings.forEach((listing) => {
                const actions = [];
                if (listing.status !== "archived" && listing.status !== "donated") {
                    actions.push(actionButton("Sửa", "edit-listing", listing.id));
                    actions.push(actionButton("Lưu trữ", "archive-listing", listing.id, "danger"));
                }
                const listingCard = makeListingCard(listing);
                const actionArea = node("div", "portal-card-actions");
                actionArea.append(...actions);
                listingCard.append(actionArea);
                listingHost.append(listingCard);
            });

            const requestHost = document.getElementById("owner-requests");
            requestHost.replaceChildren();
            const incoming = requests.filter((entry) =>
                entry.ownerId === user.id && entry.method !== "Cần sửa chữa"
            );
            if (!incoming.length) requestHost.append(empty("Chưa có yêu cầu nhận đồ gửi đến."));
            incoming.forEach((request) => requestHost.append(makeRequestCard(request, "owner")));
        }
    };
})();

    </script>
    <script src="../js/portal-ui.js" defer></script>
    <script src="../js/portal-ai.js" defer></script>
    <script src="../js/portal-actions.js" defer></script>
    <script src="../js/portal.js" defer></script>
</head>
<body data-page="owner-item-create">
    <div id="portal-root">
        <div id="portal-content">
            <section class="portal-section">
                <h2>Thông tin món đồ</h2>
                <form id="listing-form" class="portal-form" data-form="listing">
                    <div class="portal-field">
                        <label for="item-name">Tên món đồ *</label>
                        <input id="item-name" name="name" maxlength="80" required placeholder="Ví dụ: Giáo trình Cơ sở dữ liệu">
                    </div>
                    <div class="portal-field">
                        <label for="item-category">Danh mục *</label>
                        <select id="item-category" name="category" required></select>
                    </div>
                    </div>
                    <div class="portal-field">
                        <label for="item-condition">Tình trạng *</label>
                        <select id="item-condition" name="condition" required>
                            <option value="">Chọn tình trạng</option>
                            <option>Còn tốt</option>
                            <option>Đã qua sử dụng</option>
                            <option>Cần sửa chữa</option>
                        </select>
                    </div>
                    <div class="portal-field">
                        <label for="item-method">Phương án *</label>
                        <select id="item-method" name="method" required>
                            <option value="">Chọn phương án</option>
                            <option>Cho tặng</option>
                            <option>Trao đổi</option>
                            <option>Cần sửa chữa</option>
                        </select>
                    </div>
                    <div class="portal-field portal-field-wide">
                        <label for="item-keywords">Từ khóa mô tả gợi ý</label>
                        <input id="item-keywords" name="keywords" maxlength="120" placeholder="Ví dụ: bìa đẹp, không ghi chú, dùng tốt">
                    </div>
                    <div class="portal-field portal-field-wide">
                        <label for="item-description">Mô tả *</label>
                        <textarea id="item-description" name="description" maxlength="300" required placeholder="Mô tả tình trạng và lưu ý cho người nhận"></textarea>
                    </div>
                    <div class="portal-field portal-field-wide">
                        <div class="portal-actions">
                            <button class="portal-action-button" type="button" data-action="ai-describe">Tạo mô tả gợi ý</button>
                            <button class="portal-action-button primary" type="submit">Gửi kiểm duyệt</button>
                        </div>
                        <p class="portal-help">Tin mới sẽ ở trạng thái chờ kiểm duyệt. Bạn có thể sửa nội dung trước khi gửi.</p>
                        <div id="ai-description-result" aria-live="polite"></div>
                    </div>
                </form>
            </section>
        </div>
    </div>
</body>
</html>
